{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block heading %}Settings{% endblock %}{% block content %}<div class="page-intro"><div><h1>Hotel settings</h1><p>Property details, invoice identity and local account security.</p></div></div><div class="columns form-layout"><article class="panel"><h2>Property profile</h2><form method="post" class="form-grid"><label class="full">Hotel name<input value="{{values.get('hotel_name','Harbor House Hotel')}}" readonly aria-readonly="true"><small>This hotel name is fixed.</small></label><label class="full">Address<input name="address" value="{{values.get('address','')}}"></label><label>Phone<input name="phone" value="{{values.get('phone','')}}"></label><label>Email<input name="email" type="email" value="{{values.get('email','')}}"></label><label>Currency symbol<input name="currency" value="{{values.get('currency','INR')}}"></label><label>Tax percentage<input name="tax" type="number" min="0" step=".01" value="{{values.get('tax','0')}}"></label><label class="full">Invoice footer<input name="invoice_footer" value="{{values.get('invoice_footer','')}}"></label><div class="full divider"></div><h2 class="full">Change admin password</h2><label class="full">New password <small>(leave blank to keep current)</small><input name="new_password" type="password" minlength="8" autocomplete="new-password"></label><div class="full"><button class="button primary">Save settings</button></div></form></article></div>{% endblock %}
